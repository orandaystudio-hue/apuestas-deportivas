<script>
/* ============ configuración ============ */
const LIGAS=[
 {id:'mex.1',nom:'Liga MX',pais:'México'},
 {id:'esp.1',nom:'LaLiga',pais:'España'},
 {id:'uefa.champions',nom:'Champions',pais:'Europa'},
 {id:'eng.1',nom:'Premier',pais:'Inglaterra'},
 {id:'ita.1',nom:'Serie A',pais:'Italia'},
 {id:'ger.1',nom:'Bundesliga',pais:'Alemania'},
 {id:'fra.1',nom:'Ligue 1',pais:'Francia'},
 {id:'uefa.europa',nom:'Europa League',pais:'Europa'},
];
// altitud aproximada de la ciudad sede (m). Pesa en Liga MX: el visitante de nivel del mar se cansa.
const ALTITUD={'mexico city':2240,'ciudad de mexico':2240,'toluca':2660,'puebla':2135,'pachuca':2400,'queretaro':1820,'guadalajara':1566,'zapopan':1566,'leon':1815,'aguascalientes':1880,'san luis potosi':1860,'monterrey':540,'guadalupe':540,'san nicolas de los garza':540,'tijuana':30,'mazatlan':10,'cancun':10,'torreon':1120,'ciudad juarez':1130,'juarez':1130,'bogota':2640,'quito':2850,'la paz':3640,'denver':1600};
const DIAS=12, DIAS_ATRAS=4, SD_CACHE='fb.cache', TZ='America/Mexico_City';
const STAKES=[400,250,150,100,100], KINDS=['Fuerte','Sólida','Media','Valor','Riesgo'];
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=(n,d=2)=>n==null||isNaN(n)?'—':(+n).toFixed(d).replace(/\.?0+$/,'');
const pct=p=>Math.round(p*100)+'%';
const money=n=>'$'+Math.round(n).toLocaleString('es-MX');
const imp=ml=>ml<0?-ml/(-ml+100):100/(ml+100);
const us2dec=a=>a>0?1+a/100:1+100/(-a);
const dec2us=d=>d>=2?'+'+Math.round((d-1)*100):'−'+Math.round(100/(d-1));
const parseUS=s=>{const t=String(s??'').trim().replace('−','-').replace(/^\+/,'');return /^-?\d{3,5}$/.test(t)&&Math.abs(+t)>=100?+t:null};
const mlNum=s=>{if(s==null)return null;const t=String(s).trim().toUpperCase().replace('−','-');if(t==='EVEN'||t==='EV')return 100;const n=parseInt(t.replace('+',''),10);return isNaN(n)?null:n};
function toast(m,ms=4500){const t=$('#toast');t.innerHTML=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,ms)}
const ICON={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 mountain:'<path d="m3 20 6-10 4 6 3-4 5 8H3z"/>',ball:'<circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 5h-5L8 10z"/>',left:'<path d="m15 18-6-6 6-6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;
/* ============ Poisson ============ */
const fact=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/fact(k);
// Dixon-Coles: Poisson simple se queda corto en 0-0, 1-0, 0-1 y 1-1 (los empates)
function tau(i,j,lh,la,rho){if(!rho)return 1;
  if(i===0&&j===0)return 1-lh*la*rho;if(i===0&&j===1)return 1+lh*rho;
  if(i===1&&j===0)return 1+la*rho;if(i===1&&j===1)return 1-rho;return 1}
function matriz(lh,la,MAX=9,rho=0){const m=[];for(let i=0;i<=MAX;i++){m[i]=[];for(let j=0;j<=MAX;j++)m[i][j]=Math.max(0,pois(i,lh)*pois(j,la)*tau(i,j,lh,la,rho))}return m}
function mercados(lh,la,rho=0){
  const m=matriz(lh,la,9,rho);let H=0,D=0,A=0,btts=0,ou={};
  const tot=[0.5,1.5,2.5,3.5,4.5];tot.forEach(t=>ou[t]=0);
  for(let i=0;i<m.length;i++)for(let j=0;j<m.length;j++){const p=m[i][j];
    if(i>j)H+=p;else if(i===j)D+=p;else A+=p;
    if(i>0&&j>0)btts+=p;
    tot.forEach(t=>{if(i+j>t)ou[t]+=p});}
  const suma=H+D+A;H/=suma;D/=suma;A/=suma;btts/=suma;tot.forEach(t=>ou[t]/=suma);
  const marcadores=[];for(let i=0;i<6;i++)for(let j=0;j<6;j++)marcadores.push({i,j,p:m[i][j]/suma});
  marcadores.sort((a,b)=>b.p-a.p);
  return{H,D,A,btts,ou,m,marcadores:marcadores.slice(0,6),
    dcHX:H+D,dcHA:H+A,dcXA:D+A,
    h_menos1:(()=>{let s=0;for(let i=0;i<m.length;i++)for(let j=0;j<m.length;j++)if(i-j>1)s+=m[i][j];return s/suma})(),
    a_menos1:(()=>{let s=0;for(let i=0;i<m.length;i++)for(let j=0;j<m.length;j++)if(j-i>1)s+=m[i][j];return s/suma})(),
    h_mas1:(()=>{let s=0;for(let i=0;i<m.length;i++)for(let j=0;j<m.length;j++)if(i-j>-1)s+=m[i][j];return s/suma})(),
    a_mas1:(()=>{let s=0;for(let i=0;i<m.length;i++)for(let j=0;j<m.length;j++)if(j-i>-1)s+=m[i][j];return s/suma})()};
}
// busca los goles esperados (λ) que reproducen lo que dice el mercado
function ajustar(pH,pD,pA,pOver,linea=2.5){
  let mejor=null;
  const prueba=(lh,la,rho)=>{const r=mercados(lh,la,rho);const o=r.ou[linea]!=null?r.ou[linea]:r.ou[2.5];
    const e=Math.pow(r.H-pH,2)+Math.pow(r.A-pA,2)+Math.pow(r.D-pD,2)+(pOver!=null?Math.pow(o-pOver,2):0);
    if(!mejor||e<mejor.e)mejor={lh,la,rho,e,r}};
  for(let lh=0.3;lh<=3.6;lh+=0.1)for(let la=0.3;la<=3.6;la+=0.1)prueba(+lh.toFixed(2),+la.toFixed(2),0);
  const{lh:l0,la:a0}=mejor;
  for(let a=l0-0.12;a<=l0+0.12;a+=0.03)for(let b=a0-0.12;b<=a0+0.12;b+=0.03)for(let rho=-0.2;rho<=0.2001;rho+=0.05)prueba(+a.toFixed(3),+b.toFixed(3),+rho.toFixed(3));
  const{lh,la,rho}=mejor;
  for(let r2=rho-0.05;r2<=rho+0.05;r2+=0.01)prueba(lh,la,+r2.toFixed(3));
  return mejor;
}
/* ============ estado ============ */
const S={liga:store.get('fb.liga','mex.1'),cache:store.get(SD_CACHE,{}),book:store.get('fb.book',{}),tema:store.get('fb.tema','dark')};
let VIEW={pantalla:'lista',id:null};
/* ============ datos ============ */
const api=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
function ymd(d){return d.toISOString().slice(0,10).replace(/-/g,'')}
async function bajar(ligaId){
  const hoy=new Date(),dias=[];
  for(let i=-DIAS_ATRAS;i<DIAS;i++){const d=new Date(hoy.getTime()+i*864e5);dias.push(ymd(d))}
  const partidos=[];
  const tandas=await Promise.all(dias.map(d=>api(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ligaId}/scoreboard?dates=${d}`).catch(()=>null)));
  tandas.filter(Boolean).forEach(j=>(j.events||[]).forEach(e=>{
    const c=e.competitions&&e.competitions[0];if(!c)return;
    const H=c.competitors.find(x=>x.homeAway==='home'),A=c.competitors.find(x=>x.homeAway==='away');if(!H||!A)return;
    if(partidos.some(p=>p.id===e.id))return;
    const o=(c.odds||[])[0]||null;
    partidos.push({id:e.id,liga:ligaId,fecha:e.date,estado:(e.status&&e.status.type&&e.status.type.state)||'pre',
      detalle:(e.status&&e.status.type&&e.status.type.shortDetail)||'',
      local:{nom:H.team.displayName,ab:H.team.abbreviation,id:H.team.id,marcador:+H.score||0},
      visita:{nom:A.team.displayName,ab:A.team.abbreviation,id:A.team.id,marcador:+A.score||0},
      sede:(c.venue&&c.venue.fullName)||'',ciudad:(c.venue&&c.venue.address&&c.venue.address.city)||'',
      neutral:!!c.neutralSite,
      odds:o?{prov:(o.provider||{}).name,detalles:o.details,ou:o.overUnder,
        mlH:mlNum(((o.moneyline||{}).home||{}).close?.odds ?? ((o.moneyline||{}).home||{}).current?.odds),
        mlA:mlNum(((o.moneyline||{}).away||{}).close?.odds ?? ((o.moneyline||{}).away||{}).current?.odds),
        mlD:mlNum((o.drawOdds||{}).moneyLine),
        over:mlNum(((o.total||{}).over||{}).close?.odds),under:mlNum(((o.total||{}).under||{}).close?.odds)}:null});
  }));
  let tabla={};
  try{const st=await api(`https://site.api.espn.com/apis/v2/sports/soccer/${ligaId}/standings`);
    (st.children||[]).forEach(g=>((g.standings||{}).entries||[]).forEach(e=>{
      const s=Object.fromEntries(e.stats.map(x=>[x.name,x.value]));
      tabla[e.team.displayName]={pj:s.gamesPlayed,gf:s.pointsFor,gc:s.pointsAgainst,pts:s.points,pos:s.rank};
    }));}catch(e){}
  // calendario de cada equipo que juega: da la forma reciente y dónde juega de local
  const ids=[...new Set(partidos.filter(p=>p.estado!=='post').flatMap(p=>[p.local.id,p.visita.id]).filter(Boolean))];
  const forma={},casa={};
  const cals=await Promise.all(ids.map(id=>api(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ligaId}/teams/${id}/schedule`).then(j=>[id,j]).catch(()=>null)));
  cals.filter(Boolean).forEach(([id,j])=>{
    const lista=[];
    (j.events||[]).forEach(e=>{
      const c=e.competitions&&e.competitions[0];if(!c)return;
      if(((c.status||{}).type||{}).state!=='post')return;
      const mio=c.competitors.find(x=>String(x.team.id)===String(id)),otro=c.competitors.find(x=>String(x.team.id)!==String(id));
      if(!mio||!otro)return;
      const gol=x=>x&&x.score&&typeof x.score==='object'?+x.score.value:+x.score;
      const gf=gol(mio),gc=gol(otro);if(isNaN(gf)||isNaN(gc))return;
      if(mio.homeAway==='home'&&c.venue&&c.venue.address&&c.venue.address.city&&!casa[id])casa[id]=c.venue.address.city;
      lista.push({fecha:e.date,rival:otro.team.displayName,local:mio.homeAway==='home',gf,gc,res:gf>gc?'G':gf<gc?'P':'E',torneo:(e.season&&e.season.slug)||''});
    });
    lista.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    forma[id]=lista.slice(0,6);
  });
  partidos.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));

}

/* ============ modelo ============ */
function altitudDe(p){return altitudCiudad(p.ciudad)}
function altitudCiudad(ciudad){
  const c=(ciudad||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(!c)return null;
  for(const k in ALTITUD)if(c.includes(k))return ALTITUD[k];
  return null;
}
// altura de casa de cada equipo: se saca de los partidos donde ES local
function altitudCasa(equipo){
  const c=S.cache[S.liga];if(!c)return null;
  const ciudad=(c.casa||{})[equipo.id];
  if(ciudad){const a=altitudCiudad(ciudad);if(a!=null)return a}
  const suyo=c.partidos.find(x=>x.local.nom===equipo.nom&&!x.neutral&&x.ciudad);
  return suyo?altitudCiudad(suyo.ciudad):null;
}
function ultimos(equipo,n=5){
  const c=S.cache[S.liga];if(!c)return[];
  return ((c.forma||{})[equipo.id]||[]).slice(0,n);
}
function modelo(p){
  if(!p.odds||p.odds.mlH==null||p.odds.mlA==null||p.odds.mlD==null)return null;
  const o=p.odds,s=imp(o.mlH)+imp(o.mlD)+imp(o.mlA);
  const pH=imp(o.mlH)/s,pD=imp(o.mlD)/s,pA=imp(o.mlA)/s;
  let pOver=null;
  if(o.over!=null&&o.under!=null){const so=imp(o.over)+imp(o.under);pOver=imp(o.over)/so}
  const linea=o.ou!=null?o.ou:2.5;
  const base=ajustar(pH,pD,pA,pOver,linea);
  // ajustes acotados
  const razones=[];let dh=0,da=0;
  const alt=altitudDe(p),altV=altitudCasa(p.visita);
  const tabla=(S.cache[S.liga]||{}).tabla||{};
  if(alt!=null&&alt>=1800&&!p.neutral&&altV!=null&&alt-altV>=1200){
    razones.push({f:`Altura: ${p.ciudad} (~${alt} m) contra un visitante de ~${altV} m`,h:0.06,a:-0.06,
      por:'El visitante que no vive en altura se cansa en el último tercio. El ajuste es chico porque el mercado ya lo sabe.'});
    dh+=0.06;da-=0.06;
  }else if(alt!=null&&alt>=1800&&altV!=null&&alt-altV<1200){
    razones.push({f:'Altura: sin ventaja',h:0,a:0,por:`Los dos juegan en altura (local ~${alt} m, visitante ~${altV} m): no hay diferencia que cobrar.`});
  }
  const tl=tabla[p.local.nom],tv=tabla[p.visita.nom];
  if(tl&&tv&&tl.pj>=5&&tv.pj>=5){
    const gfl=tl.gf/tl.pj,gcv=tv.gc/tv.pj,gfv=tv.gf/tv.pj,gcl=tl.gc/tl.pj;
    const lhStats=(gfl+gcv)/2,laStats=(gfv+gcl)/2;
    const mezclaH=(lhStats-base.lh)*0.2,mezclaA=(laStats-base.la)*0.2;
    const ch=Math.max(-0.25,Math.min(0.25,mezclaH)),ca=Math.max(-0.25,Math.min(0.25,mezclaA));
    if(Math.abs(ch)>0.02||Math.abs(ca)>0.02){
      razones.push({f:'Goles de la temporada',h:ch,a:ca,por:`${p.local.nom} marca ${fmt(gfl,2)} y recibe ${fmt(gcl,2)} por juego; ${p.visita.nom}, ${fmt(gfv,2)} y ${fmt(gcv,2)}. Se mezcla al 20 % con lo que dice el mercado.`});
      dh+=ch;da+=ca;
    }
  }
  const lh=Math.max(0.15,base.lh+dh),la=Math.max(0.15,base.la+da);
  const r=mercados(lh,la,base.rho),rMkt=base.r;
  return{pMkt:{H:pH,D:pD,A:pA,over:pOver},linea,base,lh,la,r,rMkt,razones,
    apuestas:apuestas(p,r,lh,la,linea)};
}
function apuestas(p,r,lh,la,linea){
  const L=p.local.ab||p.local.nom,V=p.visita.ab||p.visita.nom;
  const cands=[
    {t:`${L} o empate (doble oportunidad)`,p:r.dcHX,k:'dc'},
    {t:`${V} o empate (doble oportunidad)`,p:r.dcXA,k:'dc'},
    {t:'Alguno gana (sin empate)',p:r.dcHA,k:'dc'},
    {t:`Gana ${L}`,p:r.H,k:'1x2'},{t:'Empate',p:r.D,k:'1x2'},{t:`Gana ${V}`,p:r.A,k:'1x2'},
    {t:'Más de 1.5 goles',p:r.ou[1.5],k:'ou'},{t:'Menos de 1.5 goles',p:1-r.ou[1.5],k:'ou'},
    {t:'Más de 2.5 goles',p:r.ou[2.5],k:'ou'},{t:'Menos de 2.5 goles',p:1-r.ou[2.5],k:'ou'},
    {t:'Más de 3.5 goles',p:r.ou[3.5],k:'ou'},{t:'Menos de 3.5 goles',p:1-r.ou[3.5],k:'ou'},
    {t:'Ambos anotan: sí',p:r.btts,k:'btts'},{t:'Ambos anotan: no',p:1-r.btts,k:'btts'},
    {t:`${L} +1 (hándicap europeo)`,p:r.h_mas1,k:'hcp'},{t:`${V} +1 (hándicap europeo)`,p:r.a_mas1,k:'hcp'},
    {t:`${L} -1 (hándicap europeo)`,p:r.h_menos1,k:'hcp'},{t:`${V} -1 (hándicap europeo)`,p:r.a_menos1,k:'hcp'},
  ];
  const cerca=(obj,meta)=>obj.slice().sort((a,b)=>Math.abs(a.p-meta)-Math.abs(b.p-meta))[0];
  const usados=new Set(),out=[];
  const toma=(sel)=>{if(!sel)return;if(usados.has(sel.t))return;usados.add(sel.t);out.push(sel)};
  toma(cerca(cands.filter(c=>c.p>=.74&&c.p<=.93),.85)||cerca(cands,.85));
  toma(cerca(cands.filter(c=>!usados.has(c.t)&&c.p>=.6&&c.p<=.78),.68));
  toma(cerca(cands.filter(c=>!usados.has(c.t)&&c.p>=.5&&c.p<=.65),.57));
  toma(cerca(cands.filter(c=>!usados.has(c.t)&&c.p>=.35&&c.p<=.52),.45));
  const mrk=r.marcadores[0];
  toma({t:`Marcador exacto ${mrk.i}-${mrk.j}`,p:mrk.p,k:'exacto'});
  while(out.length<5)toma(cerca(cands.filter(c=>!usados.has(c.t)),.5));
  return out.slice(0,5).map((b,i)=>{
    const fair=1/b.p,est=Math.max(1.01,fair*0.94),bo=S.book[p.id+'-'+i];
    const d=bo?us2dec(bo):est;
    return{...b,i,kind:KINDS[i],stake:STAKES[i],fair,est,book:bo,d,ret:STAKES[i]*d,ev:b.p*STAKES[i]*d-STAKES[i]};
  });
}

    inp.onchange=inp.onblur=()=>{const k=p.id+'-'+inp.dataset.i,v=inp.value.trim();
      if(!v){delete S.book[k]}else{const n=parseUS(v);if(n==null){toast('Momio no válido: escríbelo como −150 o +130');return}if(S.book[k]===n)return;S.book[k]=n}
      store.set('fb.book',S.book);const y=scrollY;render();scrollTo(0,y)};
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};
  });
}
/* ============ tema e inicio ============ */
function tema(t){const r=document.documentElement;r.classList.add('sin-anim');r.dataset.theme=t;void r.offsetWidth;
 requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.remove('sin-anim')));
 const b=$('#theme');b.innerHTML=`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[t==='dark'?'sun':'moon']}</svg>`;
 b.setAttribute('aria-label',t==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro')}
tema(S.tema);
$('#theme').onclick=()=>{S.tema=S.tema==='dark'?'light':'dark';store.set('fb.tema',S.tema);tema(S.tema)};
$('#load').onclick=()=>cargar(true);
addEventListener('hashchange',()=>{const h=location.hash;const m=h.match(/^#\/p\/(\d+)/);VIEW=m?{pantalla:'partido',id:m[1]}:{pantalla:'lista'};render()});
(function inicio(){const m=location.hash.match(/^#\/p\/(\d+)/);if(m)VIEW={pantalla:'partido',id:m[1]};
 render();cargar(false)})();
</script>
