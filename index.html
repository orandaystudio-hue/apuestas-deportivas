<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFL Semana 3 · 2026</title>
<meta name="description" content="Análisis de los 16 juegos de la semana 3 de la NFL 2026: probabilidades, lesiones, clima, estadísticas y 5 apuestas por juego.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c;--surface:#111a2e;--surface-2:#172340;--surface-3:#1e2d52;
  --tx:#e6ecf8;--tx-2:#a7b4cf;--tx-3:#8593b3;--line:#24345c;
  --primary:#2563eb;--primary-2:#60a5fa;--on-primary:#fff;
  --accent:#f59e0b;--accent-tx:#fbbf24;--ok:#22c55e;--ok-tx:#4ade80;--bad:#ef4444;--bad-tx:#f87171;
  --away:#60a5fa;--home:#f59e0b;
  --ring:#93c5fd;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  --r:10px;--r-sm:6px;--t:180ms;
  --mono:'Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme=light]{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#eef2f9;--surface-3:#e2e8f4;
  --tx:#0f1a33;--tx-2:#3d4a66;--tx-3:#5a6784;--line:#d5deee;
  --primary:#1e40af;--primary-2:#1e3a8a;--accent:#b45309;--accent-tx:#7c3c06;
  --ok:#15803d;--ok-tx:#14532d;--bad:#b91c1c;--bad-tx:#991b1b;--away:#1d4ed8;--home:#b45309;
  --ring:#1e40af;--shadow:0 1px 2px rgba(15,26,51,.06),0 6px 18px rgba(15,26,51,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);min-height:100dvh}
a{color:var(--primary-2)}[data-theme=light] a{color:var(--primary)}
a.card,a.card *{color:var(--tx)}[data-theme=light] a.card,[data-theme=light] a.card *{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:8px;z-index:100}.skip:focus{left:12px}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--tx-2)}.dim{color:var(--tx-3)}.sm{font-size:14px}.xs{font-size:13px}
.ok{color:var(--ok-tx)}.bad{color:var(--bad-tx)}.acc{color:var(--accent-tx)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;font-size:18px;text-decoration:none;color:var(--tx);margin-right:auto}
.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;font-family:var(--mono);font-size:14px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--tx-3)}
nav.main{display:flex;gap:4px}
nav.main a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:8px;text-decoration:none;color:var(--tx-2);font-weight:500;transition:background var(--t),color var(--t)}
nav.main a:hover{background:var(--surface-2);color:var(--tx)}
nav.main a[aria-current=page]{background:var(--surface-3);color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;transition:background var(--t),border-color var(--t),transform 120ms}
.btn:hover{background:var(--surface-2);border-color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:#1d4ed8;border-color:#1d4ed8}
[data-theme=light] .btn.primary:hover{background:#1a3894;border-color:#1a3894}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{width:44px;padding:0}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* status line */
.status{border-bottom:1px solid var(--line);background:var(--surface)}
.status .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-top:8px;padding-bottom:8px;font-size:13px;color:var(--tx-2)}
.status span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx-3)}.dot.on{background:var(--ok)}.dot.warn{background:var(--accent)}
main{padding:20px 0 64px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:13px;color:var(--tx-3)}.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px}.kpi .s{font-size:13px;color:var(--tx-2)}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{min-height:44px;padding:0 12px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--tx-2);font-weight:500}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--tx)}
label.sel{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--tx-2)}
select{min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--tx);box-shadow:var(--shadow);transition:border-color var(--t),transform var(--t)}
.card:hover{border-color:var(--primary);transform:translateY(-2px)}
.card .when{display:flex;justify-content:space-between;font-size:13px;color:var(--tx-3);margin-bottom:8px}
.team{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:4px 0}
.ab{display:grid;place-items:center;height:30px;border-radius:6px;font-family:var(--mono);font-weight:600;font-size:13px;background:var(--surface-3)}
.ab.a{box-shadow:inset 3px 0 0 var(--away)}.ab.h{box-shadow:inset 3px 0 0 var(--home)}
.team .nm{font-weight:600;line-height:1.2}.team .nm small{display:block;font-weight:400;font-size:13px;color:var(--tx-3)}
.team .pc{font-family:var(--mono);font-weight:600;font-size:18px}
.prob{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:10px 0;background:var(--surface-3)}
.prob i{display:block;height:100%}.prob .pa{background:var(--away)}.prob .ph{background:var(--home)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--tx-2);border:1px solid var(--line)}
.chip.warn{color:var(--accent-tx);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.chip.bad{color:var(--bad-tx);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chip.ok{color:var(--ok-tx);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.chip svg.i{width:14px;height:14px}
.pick{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.pick b{color:var(--ok-tx)}
.score{font-family:var(--mono);font-weight:600}
/* sections */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h2{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--primary-2);text-decoration:none;font-weight:500}
.hero{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.hero .side .ab{height:48px;font-size:18px;margin:0 auto 6px;width:72px}
.hero .side .big{font-family:var(--mono);font-size:34px;font-weight:600}
.hero .vs{color:var(--tx-3);font-family:var(--mono)}
.subnav{position:sticky;top:var(--top-h,61px);z-index:30;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.subnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--tx-2);font-size:14px;font-weight:500}
.subnav a:hover{color:var(--tx);border-color:var(--primary)}
section[id]{scroll-margin-top:calc(var(--sticky-h,130px) + 12px)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:900px){.two,.three{grid-template-columns:minmax(0,1fr)}.hero .side .big{font-size:26px}}
@media(max-width:700px){
  .hero{grid-template-columns:1fr auto 1fr;align-items:start;gap:6px}
  .hero .side{display:flex;flex-direction:column;align-items:center}
  .hero .side>div:nth-child(2){min-height:2.6em;display:flex;align-items:center;text-align:center}
  .hero .vs{align-self:center}
}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.tw[data-scroll]::after{content:"Se desliza →";position:sticky;right:0;bottom:0;float:right;font-size:12px;background:var(--surface-3);color:var(--tx-2);padding:2px 8px;border-radius:99px;margin:-26px 4px 4px 0}
@media(max-width:700px){
}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:13px;color:var(--tx-3);font-weight:500;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.better{font-weight:700;color:var(--tx)}.better::after{content:" ▲";font-size:10px;color:var(--ok-tx)}
.worse{color:var(--tx-3)}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat .k{font-size:13px;color:var(--tx-3)}.stat .v{font-family:var(--mono);font-size:18px;font-weight:600;white-space:nowrap;overflow-wrap:normal}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:3px 0}
#s-fuentes ul.clean li{margin:0}
#s-fuentes a{display:inline-block;padding:12px 0;line-height:1.35;min-height:44px}
.note{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.note.info{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.range{display:grid;gap:4px;margin:12px 0}.range label{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--primary);min-height:44px}
input.odds{width:92px;min-height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0 8px;font-family:var(--mono);text-align:right}
input.odds[aria-invalid=true]{border-color:var(--bad)}
input.stake{width:110px;min-height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 10px;font-family:var(--mono)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--surface-3);white-space:nowrap}
.tag.t0{background:color-mix(in srgb,var(--ok) 22%,var(--surface-2));color:var(--ok-tx)}
.tag.t1{background:color-mix(in srgb,var(--primary) 22%,var(--surface-2));color:var(--primary-2)}
.tag.t2{background:color-mix(in srgb,var(--accent) 20%,var(--surface-2));color:var(--accent-tx)}
.tag.t3,.tag.t4{background:var(--surface-3);color:var(--tx-2)}
.res{font-weight:600;font-size:13px}.res.w{color:var(--ok-tx)}.res.l{color:var(--bad-tx)}.res.p{color:var(--tx-2)}
.pl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big-odds{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent-tx)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:60;max-width:min(560px,calc(100% - 32px));font-size:14px}
.toast button{pointer-events:auto}
footer{border-top:1px solid var(--line);padding:18px 0 32px;color:var(--tx-3);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--tx-2)}
/* ===================== CELULAR ===================== */
@media(max-width:700px),(max-height:500px) and (orientation:landscape){
  /* encabezado de una sola fila: antes se comía un tercio de la pantalla */
  /* sin desenfoque en celular: si el encabezado lo tiene, la barra de abajo se ancla a ÉL y no a la pantalla */
  .top{backdrop-filter:none;background:var(--bg)}
  .top .wrap{min-height:56px;gap:8px;padding:4px 16px;flex-wrap:nowrap}
  .brand{font-size:16px;gap:8px}.brand b{width:30px;height:30px;font-size:12px}
  #live span{display:none}
  #live{width:44px;padding:0}
  .status .wrap{padding:6px 16px;font-size:12px;gap:10px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .status .wrap::-webkit-scrollbar{display:none}
  /* navegación abajo, como cualquier app */
  nav.main{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    gap:0;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 12px rgba(0,0,0,.18)}
  nav.main a{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;border-radius:0;font-size:11px;font-weight:500}
  nav.main a span{display:block!important;font-size:11px;line-height:1.1}
  nav.main a[aria-current=page]{background:none;color:var(--primary-2);box-shadow:inset 0 -3px 0 var(--primary)}
  main{padding-bottom:88px}
  body.tecleando nav.main{display:none}      /* con el teclado abierto estorba */
  body.tecleando main{padding-bottom:24px}
  nav.main{overflow-x:auto;scrollbar-width:none}   /* con letra gigante las pestañas se deslizan */
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{flex:1 0 auto;min-width:19%}
  .toast{left:12px;right:12px;transform:none;max-width:none;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  footer{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  body{padding-bottom:env(safe-area-inset-bottom,0)}
  h1{font-size:22px}h2{font-size:18px}
  .wrap{padding:0 14px}
  .panel{padding:14px 12px}
  /* tablas: celdas más apretadas para que quepan sin deslizarse */
  th,td{padding:7px 5px;font-size:13.5px}
  thead th{font-size:12.5px}
  .tag{font-size:12.5px}
  input,select,textarea{font-size:16px}   /* menos de 16 y iOS hace zoom al tocar */
  input.odds{width:88px;min-height:44px}
  input.stake{min-height:46px}
  select{min-height:46px}
  .subnav{gap:5px;padding:6px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav a{flex:0 0 auto}
  .subnav a{min-height:44px;font-size:13.5px;padding:0 11px}
  .seg button{min-height:44px}
  /* los 4 indicadores en una fila que se desliza: antes empujaban los juegos fuera de la pantalla */
  .kpis{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:10px -14px;padding:2px 14px 6px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 auto;min-width:138px;padding:8px 12px;scroll-snap-align:start}
  .kpi .v{font-size:18px}.kpi .k{font-size:12.5px}.kpi .s{font-size:12.5px}
  /* controles cómodos para el dedo */
  input[type=range]{min-height:44px}
  summary,details>summary{min-height:44px;display:flex;align-items:center;padding:4px 0}
  #tk{font-size:16px!important}
  .hero .side .big{font-size:30px}
  /* las tablas que no caben se vuelven tarjetas */
  /* la tabla del modelo: el texto largo a todo lo ancho y los dos números abajo */
  #s-modelo table,#s-modelo tbody,#s-modelo tfoot{display:block}
  #s-modelo thead{display:none}
  #s-modelo tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
  #s-modelo td:first-child{grid-column:1/-1}
  #s-modelo td{border:0;padding:1px 0}
  #s-modelo td:not(:first-child)::before{content:attr(data-l) " ";color:var(--tx-3);font-size:12px}
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  table.cards td{border:0;padding:3px 0;text-align:left!important}
  table.cards td[data-l]::before{content:attr(data-l) ": ";color:var(--tx-3);font-size:12.5px}
  table.cards tfoot tr{background:var(--surface-2)}
  table.cards caption{padding-bottom:4px}
}
@media(max-width:360px){
  .wrap{padding:0 12px}
  #s-modelo th,#s-modelo td{padding:6px 3px;font-size:12.5px}
  nav.main a span{font-size:10px}
  .kpis{grid-template-columns:1fr 1fr}
}
/* celular acostado: poca altura, el encabezado no puede comerse la pantalla */
@media(max-height:500px) and (orientation:landscape){
  .top .wrap{min-height:48px;padding:2px 16px}
  .brand{font-size:15px;min-height:44px}.brand small{display:none}
  .brand b{width:28px;height:28px;font-size:11px}
  /* los objetivos táctiles se quedan en 44: lo único que se va son los indicadores,
     que son decorativos. El párrafo de instrucciones se queda: explica cómo se usa. */
  .kpis{display:none}
  .status .wrap{padding:4px 16px;font-size:12px}
  main{padding:12px 0 40px}
  h1{font-size:20px;margin-bottom:2px}
  h2{font-size:17px}
  .panel{padding:12px}
  .kpis{margin:8px 0}
  .subnav{padding:5px 0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* al cambiar de tema se apagan las transiciones: si no, Chrome deja congelado el color viejo */
.sin-anim *,.sin-anim *::before,.sin-anim *::after{transition:none!important}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><b>W3</b><span>NFL · Semana 3<small>Temporada 2026</small></span></a>

/* ================== modelo ================== */
function linesOf(g){const L=Object.assign({},g.lines),lv=S.live[g.id];if(lv&&lv.lines){for(const k of ['spread_home','total','ml_away','ml_home'])if(lv.lines[k]!=null&&!isNaN(lv.lines[k]))L[k]=lv.lines[k];L._live=true}return L}
function sideTxt(team,x){return x===0?`${team} gana (moneyline)`:`${team} ${x>0?'−'+fmt(x):'+'+fmt(-x)}`}
function model(g){
  const L=linesOf(g),u=S.adj[g.id]||{m:0,t:0};
  const pa=imp(L.ml_away),ph=imp(L.ml_home),pH=ph/(pa+ph);
  const mkt=-L.spread_home,mlM=SDM*invPhi(pH),base=(mkt+mlM)/2;
  const am=clamp(+(g.model&&g.model.margin_adj_home)||0,-3,3),at=clamp(+(g.model&&g.model.total_adj)||0,-4,4);
  const mu=base+am+u.m,tot=L.total+at+u.t;
  const pHome=1-Phi(-mu/SDM);
  const favHome=mu>=0,fav=favHome?g.teams[1]:g.teams[0],dog=favHome?g.teams[0]:g.teams[1],fm=Math.abs(mu);
  const pSide=(isFav,x)=>1-Phi((x-(isFav?fm:-fm))/SDM); // P(margen del equipo > x)
  const bets=[];
  const alt=(target)=>{const x=half(fm+SDM*invPhi(1-target));return{kind:'side',team:fav.abbr,teamName:fav.name,home:favHome,x,p:pSide(true,x),txt:sideTxt(fav.abbr,x)+' (hándicap alterno)'}};
  bets.push(alt(.82));
  const pFav=pSide(true,0);
  if(pFav>=.55&&pFav<=.78)bets.push({kind:'side',team:fav.abbr,home:favHome,x:0,p:pFav,txt:sideTxt(fav.abbr,0)});
  else bets.push(alt(.65));
  // dirección del total: 1) el modelo, 2) hacia dónde se movió la línea desde que abrió, 3) si no hay nada, es un volado
  const lean=tot-L.total,open=g.lines&&g.lines.open_total;let overLean,totWhy;
  if(Math.abs(lean)>=.1){overLean=lean>0;totWhy=''}
  else if(open!=null&&Math.abs(L.total-open)>=.5){overLean=L.total>open;totWhy=`Casi un volado: el modelo no ve ventaja. Para desempatar se toma el lado hacia donde se movió la línea (abrió en ${fmt(open)}, hoy ${fmt(L.total)}).`}
  else{overLean=false;totWhy='Sin ventaja clara para ningún lado: es un volado.'}
  let tl=overLean?L.total-5:L.total+5;
  if(Number.isInteger(tl))tl+=overLean?-0.5:0.5;   // nunca dejar línea entera: habría empate
  bets.push({kind:'total',dir:overLean?'over':'under',line:tl,p:overLean?1-Phi((tl-tot)/SDT):Phi((tl-tot)/SDT),txt:`${overLean?'Más':'Menos'} de ${fmt(tl)} puntos (total alterno)`,note:totWhy});
  // spread del mercado
  const line=Math.abs(L.spread_home),mktFavHome=L.spread_home<=0,mfIsFav=mktFavHome===favHome;
  const mf=mktFavHome?g.teams[1]:g.teams[0],md=mktFavHome?g.teams[0]:g.teams[1];
  const pCov=pSide(mfIsFav,line);
  if(line===0)bets.push({kind:'side',team:fav.abbr,home:favHome,x:0,p:pFav,txt:sideTxt(fav.abbr,0)+' (pick\'em)'});
  else if(pCov>=.5)bets.push({kind:'side',team:mf.abbr,home:mktFavHome,x:line,p:pCov,txt:`${mf.abbr} −${fmt(line)} (spread)`});
  else bets.push({kind:'side',team:md.abbr,home:!mktFavHome,x:-line,p:1-pCov,txt:`${md.abbr} +${fmt(line)} (spread)`});
  const pO=1-Phi((L.total-tot)/SDT);
  bets.push({kind:'total',dir:overLean?'over':'under',line:L.total,p:overLean?pO:1-pO,txt:`${overLean?'Más':'Menos'} de ${fmt(L.total)} puntos`,note:totWhy});
  if(bets[3].p<.524)bets[3].note='Ventaja mínima: a −110 necesita 52.4 % para salir a mano. Solo vale con mejor momio.';
  bets.forEach((b,i)=>{b.i=i;b.kindName=KINDS[i];b.stake=STAKES[i];
    b.min=1/b.p;                                   // momio de equilibrio: abajo de esto se pierde a la larga
    b.bk=[g.id,i,b.kind,b.kind==='total'?b.dir:b.team,b.kind==='total'?b.line:b.x].join('|'); // la clave es la SELECCIÓN
    const bo=S.book[b.bk];b.book=bo;b.d=bo?us2dec(bo):null;
    b.ret=b.d?b.stake*b.d:null;b.ev=b.d?b.p*b.ret-b.stake:null;b.grade=grade(g,b)});
  return{L,mu,tot,pHome,fav,dog,favHome,bets,base,mkt,mlM,am,at,u,
    ptsH:(tot+mu)/2,ptsA:(tot-mu)/2};
}
function grade(g,b){const lv=S.live[g.id];if(!lv||!lv.score||lv.state!=='post')return null;const{away,home}=lv.score;
  if(b.kind==='total'){const t=away+home;if(t===b.line)return'p';return(b.dir==='over'?t>b.line:t<b.line)?'w':'l'}
  const m=b.home?home-away:away-home;if(m===b.x)return'p';return m>b.x?'w':'l'}

function kickState(g){const lv=S.live[g.id];if(!lv||!lv.state||lv.state==='pre')return'';return lv.state==='post'?`<span class="chip ok">Final ${lv.score.away}-${lv.score.home}</span>`:`<span class="chip warn">En juego ${lv.score.away}-${lv.score.home} · ${esc(lv.detail||'')}</span>`}
function wxOf(g){const w=S.wx[g.id];return w&&w.covered?Object.assign({live:true},w):g.weather||{}}
const isTurf=g=>/^\s*(artificial|sint[eé]tic|turf|fieldturf|césped artificial)/i.test(g.venue&&g.venue.surface||'');
const roofShort=g=>isIndoor(g)?(/retr/i.test(g.venue.roof)?'Techo retráctil':'Domo'):'Al aire libre';
const cut=(s,n)=>{s=String(s||'').replace(/^[A-Za-zÁÉÍÓÚÑ.]+:\s*/,'');const i=s.search(/[.(;]/);const b=i>0&&i<n?s.slice(0,i).trim():s;return b.length>n?b.slice(0,n-1)+'…':b};
function isIndoor(g){const r=(g.venue&&g.venue.roof||'').toLowerCase().trim();if(/^(abierto|open|al aire)/.test(r))return false;return /domo|dome|cerrad|retr|techad|indoor|fijo/.test(r)}
function condChips(g){
  const v=g.venue||{},w=wxOf(g),out=[];
  out.push(`<span class="chip">${ic(isIndoor(g)?'dome':'sun')}${roofShort(g)}</span>`);
  out.push(`<span class="chip">${ic('grass')}${isTurf(g)?'Artificial':'Pasto natural'}</span>`);
  if(!isIndoor(g)&&w.temp_c!=null)out.push(`<span class="chip">${ic('temp')}${fmt(w.temp_c,0)}°C</span>`);
  if(!isIndoor(g)&&w.wind_kmh!=null&&w.wind_kmh>=20)out.push(`<span class="chip warn">${ic('wind')}${fmt(w.wind_kmh,0)} km/h</span>`);
  if(!isIndoor(g)&&w.precip_pct!=null&&w.precip_pct>=40)out.push(`<span class="chip warn">${ic('drop')}${fmt(w.precip_pct,0)}% lluvia</span>`);
  if(v.altitude_m>1000)out.push(`<span class="chip warn">${ic('mountain')}${fmt(v.altitude_m,0)} m</span>`);
  if(v.neutral)out.push(`<span class="chip warn">${ic('pin')}Sede neutral</span>`);
  const fuera=g.teams.flatMap(t=>t.injuries||[]).filter(x=>x.impact==='alto'&&/out|ir|pup|fuera|no jugar|doubtful|duda/i.test(x.status||'')&&!/activ|cleared|probable|s[ií] juega/i.test(x.status||''));
  if(fuera.length)out.push(`<span class="chip bad" title="${esc(fuera.map(x=>x.name+' ('+x.pos+')').join(', '))}">${ic('alert')}${fuera.length} fuera o en duda</span>`);
  return out.join('');
}
function viewList(){
  document.title='NFL Semana 3 · 2026';
  if(!G.length){V.innerHTML='<div class="empty">No hay datos cargados.</div>';return}
  const Ms=G.map(g=>({g,m:model(g)}));
  const visibles0=Ms.filter(({g})=>S.filter==='all'||g.day_label===S.filter);
  const base=visibles0.length?visibles0:Ms;
  const topFav=base.slice().sort((a,b)=>Math.max(b.m.pHome,1-b.m.pHome)-Math.max(a.m.pHome,1-a.m.pHome))[0];
  const topTot=base.slice().sort((a,b)=>b.m.tot-a.m.tot)[0];
  const closest=base.slice().sort((a,b)=>Math.abs(a.m.mu)-Math.abs(b.m.mu))[0];
  let list=Ms.filter(({g})=>S.filter==='all'||g.day_label===S.filter);
  if(S.sort==='conf')list.sort((a,b)=>Math.abs(b.m.pHome-.5)-Math.abs(a.m.pHome-.5));
  else if(S.sort==='total')list.sort((a,b)=>b.m.tot-a.m.tot);
  else list.sort((a,b)=>new Date(a.g.kickoff_utc)-new Date(b.g.kickoff_utc)||a.g.id-b.g.id);
  const days=['all','Jueves','Domingo','Lunes'];
  const visibles=Ms.filter(({g})=>S.filter==='all'||g.day_label===S.filter);
  V.innerHTML=`<h1>${S.filter==='all'?'Los 16 juegos de la semana 3':`${visibles.length} juego${visibles.length===1?'':'s'} del ${S.filter.toLowerCase()}`}</h1>
  <p class="muted">Toca un juego para ver todo: equipos, lesiones, clima, estadística y las 5 apuestas de $1,000.</p>
  <div class="kpis">
   <div class="kpi"><div class="k">Juegos</div><div class="v">${visibles.length}</div><div class="s">${money(visibles.length*1000)} en juego</div></div>
   <div class="kpi"><div class="k">Favorito más claro</div><div class="v">${pct(Math.max(topFav.m.pHome,1-topFav.m.pHome))}</div><div class="s">${esc(topFav.m.fav.abbr)} vs ${esc(topFav.m.dog.abbr)}</div></div>
   <div class="kpi"><div class="k">Juego más parejo</div><div class="v">${pct(Math.max(closest.m.pHome,1-closest.m.pHome))}</div><div class="s">${esc(closest.g.teams[0].abbr)} @ ${esc(closest.g.teams[1].abbr)}</div></div>
   <div class="kpi"><div class="k">Más puntos esperados</div><div class="v">${fmt(topTot.m.tot)}</div><div class="s">${esc(topTot.g.teams[0].abbr)} @ ${esc(topTot.g.teams[1].abbr)}</div></div>
  </div>
  <div class="bar">
   <div class="seg" role="group" aria-label="Filtrar por día">${days.map(d=>`<button type="button" aria-pressed="${S.filter===d}" data-f="${d}">${d==='all'?'Todos':d}</button>`).join('')}</div>
   <label class="sel">Ordenar <select id="sort"><option value="time">Por hora</option><option value="conf">Por confianza</option><option value="total">Por puntos esperados</option></select></label>
  </div>
  <div class="grid">${list.map(({g,m})=>card(g,m)).join('')||'<div class="empty">Ningún juego ese día.</div>'}</div>`;
  $('#sort').value=S.sort;
  $('#sort').onchange=e=>{S.sort=e.target.value;store.set('w3.sort',S.sort);viewList()};
  V.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;store.set('w3.filter',S.filter);viewList()});
}

function injTable(t){const inj=t.injuries||[];if(!inj.length)return`<p class="xs dim">${esc(t.abbr)}: sin bajas relevantes reportadas.</p>`;
  const ord={alto:0,medio:1,bajo:2};
  return`<div class="tw"><table class="cards"><caption class="sm" style="text-align:left;padding:6px 0;font-weight:600">${esc(t.name)}</caption><thead><tr><th>Jugador</th><th>Pos.</th><th>Estatus</th><th>Impacto</th><th class="r">≈ pts</th></tr></thead><tbody>
  ${inj.slice().sort((a,b)=>ord[a.impact]-ord[b.impact]).map(x=>{const st=esc(x.status||''),corto=esc(cut(x.status,26)),resto=corto!==st?st:'';
  return`<tr><td><b>${esc(x.name)}</b>${(x.note||resto)?`<div class="xs dim">${[resto,esc(x.note||'')].filter(Boolean).join(' · ')}</div>`:''}</td><td data-l="Posición">${esc(x.pos)}</td><td data-l="Estatus">${corto}</td><td data-l="Impacto"><span class="tag ${x.impact==='alto'?'':'t3'}" style="${x.impact==='alto'?'color:var(--bad-tx)':x.impact==='medio'?'color:var(--accent-tx)':''}">${esc(x.impact)}</span></td><td data-l="Vale aprox." class="r num">${x.pts!=null?fmt(x.pts):'—'}</td></tr>`}).join('')}
  </tbody></table></div>`}
function liveInj(t){const x=S.inj&&S.inj[t.abbr];if(!x)return'';
  if(!x.items.length)return`<p class="xs dim">${esc(t.abbr)} · reporte ESPN en vivo: sin bajas.</p>`;
  return`<details style="margin:8px 0"><summary class="sm" style="cursor:pointer;min-height:44px">${esc(t.abbr)} · reporte ESPN en vivo: <b>${x.items.length}</b> jugadores no activos</summary><div class="tw"><table><thead><tr><th>Jugador</th><th>Pos.</th><th>Estatus</th><th>Nota</th></tr></thead><tbody>${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.pos)}</td><td>${esc(i.status)}</td><td class="xs dim">${esc(i.comment)}</td></tr>`).join('')}</tbody></table></div>${x.listed>=25?'<p class="xs dim">ESPN enseña como máximo 25 por equipo: puede haber más.</p>':''}</details>`}
function wxBlock(g){
  if(isIndoor(g))return`<p>${ic('dome')} Techado: el clima no cuenta.</p>`;
  const w=wxOf(g);
  return`<div class="three">
   <div class="stat"><div class="k">${ic('temp')} Temperatura</div><div class="v">${w.temp_c!=null?fmt(w.temp_c,0)+'°C':'—'}</div></div>
   <div class="stat"><div class="k">${ic('wind')} Viento</div><div class="v">${w.wind_kmh!=null?fmt(w.wind_kmh,0)+' km/h':'—'}</div>${w.gust_kmh!=null?`<div class="xs dim">ráfagas ${fmt(w.gust_kmh,0)}</div>`:''}</div>
   <div class="stat"><div class="k">${ic('drop')} Lluvia</div><div class="v">${w.precip_pct!=null?fmt(w.precip_pct,0)+'%':'—'}</div>${w.humidity!=null?`<div class="xs dim">humedad ${fmt(w.humidity,0)}%</div>`:''}</div>
  </div>
  <p class="xs dim">${w.live?'Pronóstico Open-Meteo a la hora del juego (actualizado en vivo).':w.is_forecast?'Pronóstico a la hora del juego.':'Clima típico de la zona en esta fecha, no pronóstico.'} ${esc(w.summary||'')} ${w.source?'· '+esc(w.source):''}</p>
  ${w.wind_kmh>=25?'<div class="note">Viento fuerte: históricamente baja el juego aéreo y los totales (≈ −2 a −3 pts).</div>':''}
  ${w.precip_pct>=60?'<div class="note">Lluvia probable: más carrera, más balones sueltos, total a la baja.</div>':''}`;
}

   ${(()=>{const lados=m.bets.filter(b=>b.kind==='side');const mismo=lados.length>=2&&lados.every(b=>b.team===lados[0].team);

     return`<div class="note"><b>Antes de copiarlas:</b> ${mismo?`${money(dinero)} de los $1,000 van al mismo equipo (${esc(lados[0].team)}) con distinto colchón. No son apuestas independientes: si ${esc(lados[0].team)} se cae feo, se caen las tres juntas. `:''}En Playdoit los hándicaps "seguros" (+4, +6) se pagan entre −400 y −550, casi siempre por debajo del mínimo de esta tabla. Donde su margen es más chico es en el spread y el total de siempre, a −110.</div>`})()}
   ${g.props_ideas&&g.props_ideas.length?`<h3 style="margin-top:14px">Ideas de apuestas de jugador</h3><p class="xs dim">No van en los $1,000; son para quien quiera buscarlas en su casa. Las que no traen número es porque la casa aún no publica esa línea: pídela y compárala con la razón.</p><ul class="clean sm">${g.props_ideas.slice().sort((a,b)=>(/\d/.test(b.lean+b.market)?1:0)-(/\d/.test(a.lean+a.market)?1:0)).map(p=>`<li><b>${esc(p.player)}</b> · ${esc(p.market)} → <b class="acc">${esc(p.lean)}</b>${/\d/.test(p.lean+p.market)?'':' <span class="chip">sin línea publicada</span>'} <span class="dim">— ${esc(p.why)}</span></li>`).join('')}</ul>`:''}

function parlayCalc(picks){let p=1,d=1,conBook=0;
  picks.forEach(x=>{p*=x.b.p;d*=(x.b.book?us2dec(x.b.book):x.b.min);if(x.b.book)conBook++});
  return{p,d,conBook,total:picks.length}}

  const graded=picks.filter(x=>x.b.grade),lost=graded.filter(x=>x.b.grade==='l').length;
  const equilibrio=1/d, ev=p*st*d-st;
  return`<div class="panel"><div class="pl-head"><div><h2>${title}</h2><p class="muted sm" style="margin:0">${desc}</p></div><div style="text-align:right"><div class="big-odds">×${d>=100?Math.round(d).toLocaleString('es-MX'):d.toFixed(1)}</div><div class="xs dim">${conBook?`momio combinado (${conBook} de ${picks.length} con tu casa)`:'momio de equilibrio, sin comisión'}</div></div></div>

   <div class="stat"><label class="k" for="st-${key}">Le metes</label><div><input class="stake" id="st-${key}" type="number" min="10" step="10" value="${st}" data-k="${key}"></div></div>
   <div class="stat"><div class="k">Cobrarías</div><div class="v">${money(st*d)}</div><div class="xs dim">valor esperado ${ev>=0?'+':'−'}${money(Math.abs(ev))}</div></div>
  </div>
  <div class="note ${p>=equilibrio?'ok':''}">Para que valga la pena necesitas que salga <b>${(equilibrio*100).toFixed(2)}%</b> de las veces y el modelo le da <b>${(p*100).toFixed(2)}%</b>. ${p>=equilibrio?'Con estos momios sí conviene.':`A ese precio pierde dinero a la larga: tendrían que pagarte ×${Math.round(1/p).toLocaleString('es-MX')} para estar parejos.`} ${conBook?'':'Ese momio es el "justo" sin comisión: en tu casa será más bajo, así que la cuenta real es peor.'}</div>

  <div class="tw"><table><thead><tr><th>Juego</th><th>Selección</th><th class="r">Prob.</th></tr></thead><tbody>${picks.map(x=>`<tr><td class="xs muted" style="white-space:nowrap">${esc(x.g.teams[0].abbr)} @ ${esc(x.g.teams[1].abbr)}</td><td class="sm">${esc(x.b.txt)}${x.b.grade?` <span class="res ${x.b.grade}">${x.b.grade==='w'?'✓':x.b.grade==='l'?'✗':'='}</span>`:''}</td><td class="r num">${pct(x.b.p)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

const ALIAS={'ARZ':'ARI','LA CHARGERS':'LAC','LA RAMS':'LAR','NY GIANTS':'NYG','NY JETS':'NYJ','WAS':'WAS','WSH':'WAS','TB':'TB','GB':'GB','NO':'NO','SF':'SF','KC':'KC','NE':'NE','LV':'LV'};
function findTeam(txt){
  const t=String(txt||'').toUpperCase().replace(/[.•]/g,' ').trim();
  let best=null;
  G.forEach(g=>g.teams.forEach(x=>{
    const ab=x.abbr.toUpperCase(),nick=x.name.toUpperCase().split(' ').pop(),ciudad=x.name.toUpperCase().replace(' '+nick,'');
    if(t.includes(nick)&&(!best||best.nick!==nick))best={g,x,nick};
    else if(!best&&(new RegExp('\\b'+ab+'\\b').test(t)||ALIAS[t.split(' ')[0]]===ab))best={g,x,nick};
  }));
  return best;
}
function parseTicket(txt){
  const legs=[],meta={};
  const stake=txt.match(/VALOR APOSTADO\s*\$?\s*([\d,]+(?:\.\d+)?)/i);if(stake)meta.stake=+stake[1].replace(/,/g,'');
  const tot=txt.match(/GANANCIA TOTAL:?\s*\$?\s*([\d,]+(?:\.\d+)?)/i);if(tot)meta.payout=+tot[1].replace(/,/g,'');
  const bono=txt.match(/BONO\s*\$?\s*([\d,]+(?:\.\d+)?)/i);if(bono)meta.bonus=+bono[1].replace(/,/g,'');
  const mom=txt.match(/MOMIOS:\s*([+-]?\d{3,6}|\d+\.\d+)\s*$/m)||txt.match(/MOMIOS:\s*([+-]?\d{4,6}|\d+\.\d+)/);
  if(mom)meta.parlayOdds=/\./.test(mom[1])?decAUS(+mom[1]):+mom[1];
  // bloques: línea de partido "AAA @ BBB" seguida de una selección con Momios.
  // El PDF a veces parte una selección en varios renglones: se vuelve a unir con el suyo.
  const lines=[];
  for(const ln of txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
    const prev=lines[lines.length-1];
    if(prev&&/^(Ganador|H[áa]ndicap|Total|M[áa]s|Menos)/i.test(prev)&&!/Momios:\s*[+-]?\d/i.test(prev))lines[lines.length-1]=prev+' '+ln;
    else lines.push(ln);
  }
  let cur=null;
  for(const ln of lines){
    const vs=ln.match(/^(.+?)\s+@\s+(.+?)$/);
    if(vs&&!/momios/i.test(ln)){cur={away:vs[1],home:vs[2]};continue}
    const sel=ln.match(/^(Ganador|H[áa]ndicap|Total|Más|Menos)[^:]*:\s*(.+?)\s*Momios:\s*([+-]?\d{3,6}|\d+\.\d+)/i);
    if(sel&&cur){legs.push({kind:sel[1].toLowerCase(),sel:sel[2].replace(/•\s*pago(\s*anticipado)?/i,'').trim(),odds:/\./.test(sel[3])?decAUS(+sel[3]):+sel[3],early:/pago/i.test(sel[2]),...cur});cur=null}
  }
  return{legs,meta};
}
function analyzeTicket(txt){
  const{legs,meta}=parseTicket(txt);
  const rows=legs.map(l=>{
    const away=findTeam(l.away),home=findTeam(l.home);
    const g=(home&&home.g)||(away&&away.g);
    if(!g)return{...l,err:'No reconocí este partido en la semana 3'};
    const m=model(g),pick=findTeam(l.sel);
    if(/total|más|menos/i.test(l.kind)){
      const n=(l.sel.match(/-?\d+(?:\.\d+)?/)||[])[0];if(n==null)return{...l,err:'No entendí la línea del total'};
      const over=/m[áa]s|over/i.test(l.sel),line=+n,p=over?1-Phi((line-m.tot)/SDT):Phi((line-m.tot)/SDT);
      const push=Number.isInteger(line)?Math.max(0,Phi((line+.5-m.tot)/SDT)-Phi((line-.5-m.tot)/SDT)):0;
      return{...l,g,txt:`${over?'Más':'Menos'} de ${line} · ${g.teams[0].abbr}@${g.teams[1].abbr}`,p,push,imp:imp(l.odds)};
    }
    if(!pick)return{...l,err:'No reconocí el equipo de la selección'};
    const isHome=pick.x.side==='home',mu=isHome?m.mu:-m.mu;
    const hs=(l.sel.match(/\(([+-]?\d+(?:\.\d+)?)\)/)||[])[1],h=hs!=null?+hs:null;
    const x=h!=null?-h:0;                          // (+4) = recibe 4 → gana si su margen > -4
    const p=1-Phi((x-mu)/SDM);
    const push=h!=null&&Number.isInteger(x)?Math.max(0,Phi((x+.5-mu)/SDM)-Phi((x-.5-mu)/SDM)):0;
    return{...l,g,txt:`${pick.x.abbr}${h!=null?' '+(h>0?'+'+fmt(h):fmt(h)):' gana'} · ${g.teams[0].abbr}@${g.teams[1].abbr}`,p,push,imp:imp(l.odds)};
  });
  const ok=rows.filter(r=>!r.err);
  const P=ok.reduce((s,r)=>s*r.p,1);
  const Ppush=ok.reduce((s,r)=>s*(r.p+r.push),1);   // con empates: la pata se cae y el boleto sigue vivo
  const decs=ok.reduce((s,r)=>s*us2dec(r.odds),1);
  const stake=meta.stake||150,payout=meta.payout||stake*decs;
  // cinturón de seguridad: si el momio del cupón no cuadra con las patas leídas, me faltó leer alguna
  const cupon=meta.parlayOdds!=null?us2dec(meta.parlayOdds):null;
  const descuadre=cupon&&ok.length&&Math.abs(cupon/decs-1)>.03?{cupon,leido:decs}:null;
  return{rows,meta,P,Ppush,decs,stake,payout,ev:P*payout-stake,need:stake/payout,descuadre};
}

async function liveESPN(){
  const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=3&dates=2026');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();let n=0;
  (j.events||[]).forEach(ev=>{
    const c=ev.competitions&&ev.competitions[0];if(!c)return;
    const H=c.competitors.find(x=>x.homeAway==='home'),A=c.competitors.find(x=>x.homeAway==='away');if(!H||!A)return;
    const g=G.find(x=>normAb(x.teams[1].abbr)===normAb(H.team.abbreviation)&&normAb(x.teams[0].abbr)===normAb(A.team.abbreviation));if(!g)return;
    const st=ev.status&&ev.status.type||{},prev=S.live[g.id]||{};
    const rec={state:st.state||'pre',detail:st.shortDetail||'',at:new Date().toISOString(),lines:prev.lines||null,score:null};
    if(rec.state!=='pre')rec.score={away:+A.score||0,home:+H.score||0};
    const o=c.odds&&c.odds[0];
    if(o&&rec.state==='pre'){
      const L={};
      if(typeof o.spread==='number')L.spread_home=o.spread;
      if(typeof o.overUnder==='number')L.total=o.overUnder;
      const ml=o.moneyline||{};
      const mh=mlNum(ml.home&&(ml.home.close||ml.home.current||{}).odds),ma=mlNum(ml.away&&(ml.away.close||ml.away.current||{}).odds);
      if(mh!=null&&ma!=null){L.ml_home=mh;L.ml_away=ma}
      L.provider=o.provider&&o.provider.name;L.details=o.details;
      if(Object.keys(L).length)rec.lines=L;
    }
    S.live[g.id]=rec;n++;
  });
  return n;
}
async function liveInjuries(){
  const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries');if(!r.ok)return;
  const j=await r.json(),out={};
  (j.injuries||[]).forEach(t=>{
    const nm=String(t.displayName||'').toLowerCase();
    const team=G.flatMap(g=>g.teams).find(x=>nm&&nm.endsWith(String(x.name||'').toLowerCase().split(' ').pop()));
    if(!team)return;
    const all=t.injuries||[],items=all.filter(x=>String(x.status||'').toLowerCase()!=='active').map(x=>({name:x.athlete&&x.athlete.displayName,pos:x.athlete&&x.athlete.position&&x.athlete.position.abbreviation,status:x.status,comment:x.shortComment||''}));
    out[team.abbr]={items,listed:all.length};
  });
  S.inj=out;store.set('w3.inj',out);
}

async function goLive(){
  const btn=$('#live'),ico=$('#liveIco');btn.disabled=true;ico.classList.add('spin');
  const msgs=[];let fail=0;
  const [a,b]=await Promise.allSettled([liveESPN(),liveWeather()]);
  if(a.status==='fulfilled')msgs.push(`ESPN: ${a.value} de ${G.length} juegos al día`);else{fail++;msgs.push('ESPN no respondió ('+esc(a.reason&&a.reason.message||a.reason)+')')}
  if(b.status==='fulfilled')msgs.push(`clima: ${b.value} estadios abiertos`);else{fail++;msgs.push('Open-Meteo no respondió ('+esc(b.reason&&b.reason.message||b.reason)+')')}
  const emparejados=a.status==='fulfilled'?a.value:0;
  if(emparejados>0){S.liveAt=new Date().toISOString();store.set('w3.liveAt',S.liveAt)}
  else if(a.status==='fulfilled')msgs.push('ojo: ESPN respondió pero no emparejó ningún juego, así que las líneas siguen siendo las de la investigación')
  store.set('w3.live',S.live);store.set('w3.wx',S.wx);
  btn.disabled=false;ico.classList.remove('spin');const y=scrollY;route();scrollTo(0,y);
  toast(msgs.join(' · ')+'.'+(fail?' <button class="btn" type="button" style="min-height:36px;margin-left:8px" onclick="goLive()">Reintentar</button>':''),fail?9000:4500);
}
async function liveWeather(){
  let n=0;
  await Promise.all(G.map(async g=>{
    const v=g.venue||{};if(isIndoor(g)||v.lat==null||v.lon==null)return;
    const k=new Date(g.kickoff_utc);if(isNaN(k))return;
    const day=k.toISOString().slice(0,10),hr=k.toISOString().slice(0,13)+':00';
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_gusts_10m,relative_humidity_2m&timezone=UTC&start_date=${day}&end_date=${day}`;
    const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    const i=(j.hourly&&j.hourly.time||[]).indexOf(hr);if(i<0)return;
    const H=j.hourly;S.wx[g.id]={covered:true,temp_c:H.temperature_2m[i],precip_pct:H.precipitation_probability[i],wind_kmh:H.wind_speed_10m[i],gust_kmh:H.wind_gusts_10m[i],humidity:H.relative_humidity_2m[i],source:'Open-Meteo',is_forecast:true};n++;
  }));
  return n;
}

 const b=$('#theme');b.setAttribute('aria-label',t==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro');b.innerHTML=`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[t==='dark'?'sun':'moon']}</svg>`}

function medirTop(){const h=document.querySelector('.top');if(h)document.documentElement.style.setProperty('--top-h',h.getBoundingClientRect().height+'px');
 const sn=document.querySelector('.subnav');
 const fijo=(h?h.getBoundingClientRect().height:0)+(sn?sn.getBoundingClientRect().height:0);
 document.documentElement.style.setProperty('--sticky-h',fijo+'px')}
medirTop();addEventListener('resize',medirTop);
// aviso de "se desliza" solo cuando la tabla de verdad se corta
function marcarScroll(){document.querySelectorAll('.tw').forEach(d=>{d.scrollWidth>d.clientWidth+4?d.setAttribute('data-scroll',''):d.removeAttribute('data-scroll')})}
let lastRoute=location.hash,posLista=0;
const esLista=h=>!/^#\/(juego|combinadas|boleto|metodo)/.test(h||'');
addEventListener('hashchange',()=>{const h=location.hash;
 if(esLista(lastRoute))posLista=scrollY;          // se guarda ANTES de repintar
 route();
 if(h!==lastRoute){scrollTo(0,esLista(h)?posLista:0);
  const t=V.querySelector('h1,h2');if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}}
 lastRoute=h});
route();
// al abrir: si las líneas tienen más de 30 minutos, se refrescan solas (se mueven todo el tiempo)
(function auto(){const viejo=!S.liveAt||(Date.now()-new Date(S.liveAt).getTime())>30*60*1000;
 if(viejo&&navigator.onLine!==false)setTimeout(()=>goLive(),400)})();
